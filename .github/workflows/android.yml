name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK; it just needs the exact
      # platform and build tools this project targets. Installing them directly
      # is more predictable than the third-party setup action, which breaks
      # whenever Google retires a legacy package name.
      - name: Install the SDK packages
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::no sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # SECURITY.md promises the permission set never grows silently.
      - name: Manifest guard
        run: |
          set -eu
          allowed='SYSTEM_ALERT_WINDOW|PACKAGE_USAGE_STATS|QUERY_ALL_PACKAGES|FOREGROUND_SERVICE|FOREGROUND_SERVICE_SPECIAL_USE|POST_NOTIFICATIONS|API_V23'
          found=$(grep -o 'android:name="[^"]*"' app/src/main/AndroidManifest.xml \
            | sed 's/android:name="//;s/"//' \
            | grep -E '^android\.permission\.|^moe\.shizuku' || true)
          unexpected=$(echo "$found" | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::New permission(s) not documented in docs/PERMISSIONS.md:"
            echo "$unexpected"
            exit 1
          fi
          echo "Permission set unchanged:"
          echo "$found"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lint

      - name: Assemble
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Rename the artifacts
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp apks/debug/*.apk "dist/originos-toolkit-${version}-debug.apk"
          if ls apks/release/*.apk >/dev/null 2>&1; then
            cp apks/release/*.apk "dist/originos-toolkit-${version}-unsigned-release.apk"
          fi
          ls -lh dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ## OriginOS Toolkit ${{ github.ref_name }}

            No-root tweak toolkit for Vivo / iQOO devices on OriginOS (FuntouchOS works too).

            ### Which APK?

            | File | Use it when |
            | --- | --- |
            | `originos-toolkit-*-debug.apk` | **Install this one.** Debug-signed, so Android will install it directly. |
            | `originos-toolkit-*-unsigned-release.apk` | You want to sign it with your own key (`apksigner sign --ks your.keystore ...`). |

            ### Before you start

            1. Install [Shizuku](https://github.com/RikkaApps/Shizuku) and start it over wireless debugging or a one-time ADB connection.
            2. Grant this app the Shizuku permission.
            3. Everything you apply is journalled and reversible from the app.

            No root, no telemetry, no network permission. Read
            [`docs/NO-ROOT-SETUP.md`](https://github.com/${{ github.repository }}/blob/main/docs/NO-ROOT-SETUP.md)
            for the setup walkthrough and
            [`SECURITY.md`](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)
            for the security model.
